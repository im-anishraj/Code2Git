name: 🐛 Bug Report
description: Report something that isn't working as expected in Code2Git
title: "[Bug]: "
labels: [bug, triage]
assignees:
  - im-anishraj
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you give, the faster it gets fixed.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Is there an existing issue for this?
      description: Please search open and closed issues before filing a new one.
      options:
        - label: I've searched existing issues and couldn't find a duplicate
          required: true

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we reach you if we need more info? (optional)
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what went wrong!
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we make it happen again?
      placeholder: |
        1. Go to '...'
        2. Solve/submit '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Which platform is this on?
      options:
        - LeetCode
        - LeetCode CN
        - GeeksforGeeks
        - HackerRank
        - Not platform-specific (dashboard, auth, settings)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Code2Git version
      description: Open the extension popup to find your version number.
      placeholder: ex. 0.1.1
    validations:
      required: false

  - type: dropdown
    id: browsers
    attributes:
      label: Which browser are you using?
      multiple: true
      options:
        - Chrome
        - Microsoft Edge
        - Brave
        - Opera
        - Other Chromium-based browser
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: ex. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any console errors from DevTools. This will be auto-formatted as code, no backticks needed.
      render: shell
    validations:
      required: false
